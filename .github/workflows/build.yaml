name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Run your script to fetch or build the native binaries
      # Replace this line with whichever script exists in your repo (e.g., ./external-libs/download.sh)
      - name: Prepare External Libraries
        run: |
          if [ -f "./external-libs/download.sh" ]; then
            chmod +x ./external-libs/download.sh
            ./external-libs/download.sh
          elif [ -f "./scripts/setup.sh" ]; then
            chmod +x ./scripts/setup.sh
            ./scripts/setup.sh
          fi

      - name: Build Release APK
        run: gradle :app:assembleUniversalGmsRelease || gradle :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OnyxChat-Release-APK
          path: app/build/outputs/apk/**/*.apk